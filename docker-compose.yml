name: ssi-demo

services:
  redis-guard:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    networks: [ssi-network]

  postgres-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ssi
      POSTGRES_PASSWORD: ssi_demo_pw
      POSTGRES_DB: ssi
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssi -d ssi"]
      interval: 3s
      timeout: 3s
      retries: 15
    networks: [ssi-network]

  issuer-service:
    build: .
    image: ssi-app:latest
    command: ["npm", "run", "start:issuer"]
    environment:
      PORT: "4001"
      ISSUER_PUBLIC_URL: ${ISSUER_PUBLIC_URL:-http://localhost:4001}
      POSTGRES_URL: postgres://ssi:ssi_demo_pw@postgres-db:5432/ssi
      RECEIPT_SECRET: ${RECEIPT_SECRET:-dev-receipt-secret-change-me}
    ports: ["4001:4001"]
    depends_on:
      postgres-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/health"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [ssi-network]

  verifier-service:
    image: ssi-app:latest
    command: ["npm", "run", "start:verifier"]
    environment:
      PORT: "4002"
      VERIFIER_PUBLIC_URL: ${VERIFIER_PUBLIC_URL:-http://localhost:4002}
      ISSUER_PUBLIC_URL: ${ISSUER_PUBLIC_URL:-http://localhost:4001}
      ISSUER_INTERNAL_URL: http://issuer-service:4001
      POSTGRES_URL: postgres://ssi:ssi_demo_pw@postgres-db:5432/ssi
      REDIS_HOST: redis-guard
      REDIS_PORT: "6379"
      STATUS_CACHE_MODE: ${STATUS_CACHE_MODE:-ETAG_REVALIDATE}
      RECEIPT_SECRET: ${RECEIPT_SECRET:-dev-receipt-secret-change-me}
    ports: ["4002:4002"]
    depends_on:
      postgres-db: {condition: service_healthy}
      redis-guard: {condition: service_healthy}
      issuer-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4002/health"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [ssi-network]

  wallet-pwa:
    image: ssi-app:latest
    command: ["npm", "run", "start:wallet"]
    environment:
      PORT: "3000"
      ISSUER_PUBLIC_URL: ${ISSUER_PUBLIC_URL:-http://localhost:4001}
      VERIFIER_PUBLIC_URL: ${VERIFIER_PUBLIC_URL:-http://localhost:4002}
      ISSUER_INTERNAL_URL: http://issuer-service:4001
      VERIFIER_INTERNAL_URL: http://verifier-service:4002
    ports: ["3000:3000"]
    depends_on:
      verifier-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [ssi-network]

  https-tunnel:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--url", "http://wallet-pwa:3000"]
    depends_on:
      wallet-pwa: {condition: service_healthy}
    networks: [ssi-network]

networks:
  ssi-network:
    driver: bridge
